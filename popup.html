<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>ELOUP.GG</title>
    <style>
        body {
            width: 300px;
            margin: 0;
            padding: 16px;
            background: #101319;
            color: #e8ebf1;
            font-family: Inter, Arial, sans-serif;
        }
        h1 { margin: 0 0 4px; font-size: 15px; font-weight: 900; }
        p { margin: 0 0 14px; font-size: 12px; color: #9aa1ad; line-height: 1.5; }
        label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 700; color: #c3c9d4; }
        input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            padding: 9px 11px;
            border: 1px solid #2c313c;
            border-radius: 10px;
            background: #171a21;
            color: #e8ebf1;
            font-size: 12px;
            font-family: ui-monospace, Consolas, monospace;
        }
        button {
            width: 100%;
            padding: 10px;
            border: 0;
            border-radius: 10px;
            background: #ccff00;
            color: #101319;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }
        button:disabled { background: #2c313c; color: #9aa1ad; cursor: default; }
        #status { margin-top: 10px; font-size: 11.5px; line-height: 1.5; color: #9aa1ad; min-height: 16px; }
        #status.ok { color: #ccff00; }
        #status.err { color: #ff8f8f; }
        a { color: #ccff00; }
        /* Тумблер ИИ — строка настройки: слева название с пояснением, справа
           переключатель. Дорожка 44×24, как role="switch" на сайте; включён —
           фирменная заливка #ccff00 с тёмной ручкой (в тон кнопке ниже) */
        #ai { margin: 0 0 12px; padding: 12px; border: 1px solid #2c313c; border-radius: 10px; background: #171a21; }
        .ai-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; cursor: pointer; }
        .ai-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .ai-title { font-size: 12px; font-weight: 700; line-height: 1.3; color: #e8ebf1; }
        .ai-sub { font-size: 11px; line-height: 1.4; color: #9aa1ad; }
        .switch {
            position: relative;
            flex: 0 0 auto;
            box-sizing: border-box;
            width: 44px;
            height: 24px;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 12px;
            background: #2c313c;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: background .2s ease;
        }
        .switch:hover { background: #3a404c; }
        .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e8ebf1;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .45);
            transition: transform .22s cubic-bezier(.4, 0, .2, 1), width .15s ease, background .2s ease;
        }
        .switch:checked, .switch:checked:hover { background: #ccff00; }
        .switch:checked::after { background: #101319; transform: translateX(20px); }
        /* Нажатие — ручка чуть растягивается по ходу движения */
        .switch:active::after { width: 24px; }
        .switch:checked:active::after { transform: translateX(16px); }
        .switch:focus-visible { outline: 2px solid #ccff00; outline-offset: 2px; }
        .switch:focus:not(:focus-visible) { outline: 0; }
        /* Положение из хранилища встаёт без анимации: переходы включаются
           классом ready уже после того, как popup.js выставил checked */
        #ai:not(.ready) .switch, #ai:not(.ready) .switch::after { transition: none; }
        @media (prefers-reduced-motion: reduce) {
            .switch, .switch::after { transition: none; }
        }
        #aiHint { margin: 10px 0 0; font-size: 11px; color: #9aa1ad; line-height: 1.5; }
    </style>
</head>
<body>
    <h1>ELOUP.GG</h1>
    <p>Токен — в настройках профиля на сайте, вкладка «Катки».</p>

    <label for="token">Токен расширения</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="1|…">

    <label for="server">Адрес сайта</label>
    <input id="server" type="text" spellcheck="false" value="https://eloup.gg">

    <div id="ai" hidden>
        <label class="ai-row" for="aiToggle">
            <span class="ai-text">
                <span class="ai-title">Каждый разбор сразу на ИИ</span>
                <span class="ai-sub">Новые демки разбираются сами</span>
            </span>
            <input type="checkbox" id="aiToggle" class="switch" role="switch">
        </label>
        <p id="aiHint" hidden>Сначала один раз подтвердите согласие на передачу данных ИИ — закажите любой разбор на <a id="aiConsentLink" target="_blank" rel="noopener">сайте ELOUP</a>.</p>
    </div>

    <button id="save">Сохранить и проверить</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
